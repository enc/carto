# GitHub secret scanning / push protection config — NOT a CI workflow
# (see docs/adr/0004-deferred-security-gates.md for why .github/ has no
# workflows yet; this file is unrelated to that decision).
#
# The paths below are carto's own redaction feature (spec §7.5, INV-6,
# docs/adr/0017-redaction-scope-and-detection-design.md): a synthetic
# fixture plus unit/acceptance tests that deliberately contain
# fake-secret-shaped strings (AWS/GitHub/GitLab/Slack/JWT formats) to
# prove carto's own detector catches them. They are not real
# credentials — every value is a documented placeholder (sequential
# digits, AWS's own canonical "EXAMPLE" suffix) — but they match the
# same well-known vendor formats GitHub's scanner looks for, since
# that's the whole point of the fixture. Excluded from scanning here
# rather than obfuscated in the source, which would defeat the
# fixture's purpose.
paths-ignore:
  - "fixtures/secrets-corpus/**"
  - "crates/carto-core/src/redact/**"
  - "crates/carto-cli/tests/cli_redaction.rs"
