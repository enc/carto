[package]
name = "carto-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "carto: bin target `carto`; clap; human+json output."

[[bin]]
name = "carto"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
carto-core = { path = "../carto-core", version = "0.1.0" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
